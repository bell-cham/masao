<!--

  地図画面は、 15 * 9 個のブロックで構成されていて、
  文字の組み合わせで表現されています。


  文字の説明

  .  空白
  a  クリス
  b  キド研究所
  c  ペットセンター
  d  店
  e  ジム
  h  ジムリーダーに勝つと開く扉

  A  ステージ１
  B  ステージ２
  C  ステージ３

  1  中継地点
  2  縦の道
  3  横の道

-->

<!--                          012345678901234-->
